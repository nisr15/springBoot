spring.application.name=crudSpringBootDemo
spring.datasource.url=jdbc:h2:file:./my-local-mysql-db;MODE=MySQL;DB_CLOSE_DELAY=-1
# spring.datasource.url=jdbc:h2:tcp://localhost:9092/~/my-spring-db;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql = true

spring.h2.console.enabled=true